name: Supabase Keep-Alive

# Ping REST API Supabase tiap 6 jam dari server GitHub (bukan Mac)
# → project free tier gak pernah idle 7 hari → gak pernah pause.
# Bekerja bahkan saat Mac/user offline total.

on:
  schedule:
    - cron: "0 1,7,13,19 * * *"   # UTC: 01,07,13,19 = 08,14,20,02 WIB
  workflow_dispatch: {}            # tombol "Run" manual di tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 30 \
            "${SB_URL}/rest/v1/rumah?select=no&limit=1" \
            -H "apikey: ${SB_KEY}")
          echo "HTTP ${code}"
          cat /tmp/resp.json | head -c 300; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase merespons $code — cek dashboard, project mungkin paused"
            exit 1
          fi

      - name: Auto-restore attempt (kalau paused)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SUPABASE }}
        run: |
          # best-effort: nada di log. Restore beneran harus via dashboard supabase.com
          echo "::warning::Ping gagal. Kalau project PAUSED: buka https://supabase.com/dashboard → pilih project → Restore."
