const sb=supabase.createClient(SB_URL,SB_KEY);
const rupiah=n=>'Rp '+(n||0).toLocaleString('id-ID');
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const blnLabel=ym=>{const[y,m]=ym.split('-');return BLN[+m-1]+' '+y};
const sortNo=arr=>arr.sort((a,b)=>{
  const N=n=>{const m=String(n).match(/^(\d+)([A-Za-z]?)$/);return m?[+m[1],m[2].toLowerCase()]:[9999,String(n)]};
  const A=N(a.no),B=N(b.no);return A[0]-B[0]||A[1].localeCompare(B[1]);
});

// Pemasukan manual admin: pakai tabel pemasukan kalau sudah dibuat, sementara simpan di konfig
const pemasukanStore={
  _key:'pemasukan_data',_c:null,
  async _init(){
    if(this._c!==null)return;
    const{data}=await sb.from('konfig').select('value').eq('key',this._key).maybeSingle();
    try{this._c=JSON.parse((data&&data.value)||'[]')}catch(e){this._c=[]}
  },
  async list(){
    const t=await sb.from('pemasukan').select('*').order('tanggal',{ascending:false}).limit(500);
    if(!t.error)return t.data||[];
    await this._init();
    return [...this._c].sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));
  },
  async add(rec){
    const t=await sb.from('pemasukan').insert(rec);
    if(!t.error)return;
    await this._init();
    this._c.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,6),...rec});
    await sb.from('konfig').upsert({key:this._key,value:JSON.stringify(this._c)},{onConflict:'key'});
  },
  async remove(id){
    const t=await sb.from('pemasukan').delete().eq('id',id);
    if(!t.error)return true;
    await this._init();
    this._c=this._c.filter(m=>m.id!==id);
    await sb.from('konfig').upsert({key:this._key,value:JSON.stringify(this._c)},{onConflict:'key'});
    return true;
  }
};

// Catatan per tagihan (log kenapa nominal beda): konfig JSON, migrasi ke kolom begitu bisa DDL
const catatanStore={
  _key:'tagihan_catatan',_m:null,
  async init(){
    if(this._m!==null)return;
    const{data}=await sb.from('konfig').select('value').eq('key',this._key).maybeSingle();
    try{this._m=JSON.parse((data&&data.value)||'{}')}catch(e){this._m={}}
  },
  get(k){return this._m?(this._m[k]||''):''},
  async set(k,v){
    await this.init();
    if(v)this._m[k]=v;else delete this._m[k];
    await sb.from('konfig').upsert({key:this._key,value:JSON.stringify(this._m)},{onConflict:'key'});
  }
};
const bulanIni=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const nextMonth=ym=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
async function getKonfig(){
  const{data}=await sb.from('konfig').select('*');
  const k={};(data||[]).forEach(r=>k[r.key]=r.value);return k;
}

    nBelum(){return this.rumah.filter(r=>r._st==='BELUM').length},

        sb.from('rumah').select('*').order('no'),

    total(){return this.items.reduce((s,i)=>s+i.nominal,0)},
    perBulan(){return this.total||0},
    saran(){
      if(!this.form.nominal)return'';
      const list=[...this.tunggakan.map(t=>t.total)];if(this.total)list.push(this.total);
      let rem=this.form.nominal,n=0;
      for(const v of list){if(rem>=v){rem-=v;n++}else break}
      if(rem>0&&n>0)return'≈ '+n+' bulan + sisa '+rupiah(rem);
      if(n>0)return'≈ cukup untuk '+n+' bulan';
      return''
    }
  },
  async mounted(){
    const no=+this.$root.params.no;
    const{data:rs}=await sb.from('rumah').select('*').eq('no',no).single();
    if(!rs){this.loading=false;return}
    this.r=rs;
    this.konfig=await getKonfig();
    const[{data:it},{data:tgs}]=await Promise.all([
      sb.from('iuran_item').select('*').eq('rumah_id',rs.id).eq('aktif',true),
      sb.from('tagihan').select('*').eq('rumah_id',rs.id).order('bulan',{ascending:false}).limit(13)
    ]);
    this.items=it||[];
    const tg=tgs||[];
    this.tunggakan=tg.filter(t=>t.bulan<this.bulan&&t.status!=='LUNAS').sort((a,b)=>a.bulan.localeCompare(b.bulan));
    await catatanStore.init();
    this.riwayat=tg.slice(0,12).map(t=>({bulan:t.bulan,status:t.status,total:t.total||0,catatan:catatanStore.get(rs.id+'_'+t.bulan)}));
    const sorted=[...tg].sort((a,b)=>a.bulan.localeCompare(b.bulan));
    let last=null;
    for(const t of sorted){if(t.status==='LUNAS')last=t.bulan;else break}
    this.lunasSd=last;
    this.loading=false;

  methods:{
    rupiah,blnLabel,
    pilihBulan(n){
      this.bulanPilih=n;
      const list=[...this.tunggakan.map(t=>t.total)];

      while(count<n){list.push(this.total);count++}
      this.form.nominal=list.slice(0,n).reduce((s,v)=>s+v,0)||null;
    },
    onFile(e){this.file=e.target.files[0]},
    async submit(){
      this.busy=true;

            const path='bukti/'+this.r.no+'_'+Date.now()+'.'+ext;
            await sb.storage.from('bukti').upload(path,this.file);
            url=sb.storage.from('bukti').getPublicUrl(path).data.publicUrl;
          }catch(e){}
        }
        const{error}=await sb.from('pembayaran').insert({rumah_id:this.r.id,nominal:this.form.nominal,tgl_transfer:this.form.tgl,bukti_url:url});
        if(error)throw error;
        this.$root.toast('Konfirmasi terkirim! Menunggu verifikasi admin.');
        this.showForm=false;this.form.nominal=null;this.file=null;
      }catch(e){this.$root.toast('Gagal mengirim: '+(e.message||'coba lagi'))}
      this.busy=false;
    }
  }
};

            </tr>
          </thead>
          <tbody>
            <tr v-for="row in yearRows" class="group">
              <td class="sticky left-0 z-10 whitespace-nowrap border-b border-gray-100 bg-white px-3 py-2.5 text-sm sm:px-5 group-hover:bg-gray-50">
                <b class="text-gray-800">{{row.no}}</b> <span class="hidden text-sm text-gray-800 sm:inline">{{namaPendek(row.pemilik)}}</span>
              </td>
              <td v-for="m in 12" class="border-b border-gray-100 px-2.5 py-2.5 text-center">
                <span v-if="row.marks[m-1]==='L'" class="inline-flex size-6 items-center justify-center rounded-full bg-success-500 text-white" title="Lunas">
                  <svg class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                </span>
                <span v-else-if="row.marks[m-1]==='X'" class="inline-flex size-6 items-center justify-center rounded-full bg-error-500 text-white" title="Belum bayar">
                  <svg class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                </span>
                <span v-else class="text-gray-300">·</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>`,
  data(){return{loading:true,yearRows:[],tahun:new Date().getFullYear(),BLN:BLN}},
  async mounted(){await this.load()},
  watch:{tahun(){this.load()}},
  methods:{
    namaPendek(p){return p?p.split(' ').slice(0,2).join(' '):''},
    exportCsv(){
      const esc=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
      const head=['Rumah','Pemilik',...BLN.map((b,i)=>b+' '+this.tahun)];
      const lines=[head.map(esc).join(',')];
      for(const row of this.yearRows){
        lines.push([row.no,row.pemilik,...row.marks.map(m=>m==='L'?'LUNAS':m==='X'?'BELUM':'-')].map(esc).join(','));
      }
      const blob=new Blob(["\ufeff"+lines.join('\n')],{type:'text/csv;charset=utf-8'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='rekap-iuran-'+this.tahun+'.csv';
      a.click();URL.revokeObjectURL(a.href);
      this.$root.toast('Rekap '+this.tahun+' diunduh');
    },
    async load(){
      this.loading=true;
      const[{data:rs},{data:tgs}]=await Promise.all([
        sb.from('rumah').select('*').order('no'),
        sb.from('tagihan').select('rumah_id,bulan,status').gte('bulan',this.tahun+'-01').lte('bulan',this.tahun+'-12')
      ]);
      const byRumah={};(tgs||[]).forEach(t=>{
        const m=+t.bulan.slice(5,7)-1;
        (byRumah[t.rumah_id]=byRumah[t.rumah_id]||Array(12).fill(null))[m]=t.status==='LUNAS'?'L':'X';
      });
      this.yearRows=sortNo((rs||[]).filter(r=>r.aktif)).map(r=>({no:r.no,pemilik:r.pemilik,marks:byRumah[r.id]||Array(12).fill(null)}));
      this.loading=false;
    }
  }
};

      <div class="rounded-xl border border-gray-200 bg-white p-4 sm:p-6">

            <button v-for="f in [['all','Semua'],['masuk','Masuk'],['keluar','Keluar']]" :key="f[0]"
              class="rounded-lg px-3.5 py-1.5 text-xs font-medium transition-colors"
              :class="filter===f[0]?'bg-brand-500 text-white':'border border-gray-200 text-gray-600 hover:bg-gray-50'"
              @click="filter=f[0]">{{f[1]}}</button>
          </div>
        </div>
        <div class="mt-3 grid grid-cols-2 gap-2.5 sm:grid-cols-12">
          <div class="relative col-span-2 sm:col-span-4">
            <svg class="pointer-events-none absolute left-3.5 top-1/2 size-4 -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>

              <option v-for="b in bulanOpsi" :value="b">{{blnLabel(b)}}</option>
            </select>
          </div>
          <div class="sm:col-span-3">
            <select v-model="katF" class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-600 outline-none focus:border-brand-500">
              <option value="">Semua kategori</option>
              <option v-for="k in kategoriOpsi" :value="k">{{k}}</option>
            </select>
          </div>
          <div class="sm:col-span-1">
            <input type="date" v-model="dari" class="w-full rounded-lg border border-gray-300 px-2 py-2 text-xs text-gray-600 outline-none focus:border-brand-500" title="Dari">
          </div>
          <div class="sm:col-span-1">
            <input type="date" v-model="sampai" class="w-full rounded-lg border border-gray-300 px-2 py-2 text-xs text-gray-600 outline-none focus:border-brand-500" title="Sampai">

          <div class="sm:col-span-1">
            <button v-if="dari||sampai||q||bulanF||katF" class="w-full rounded-lg border border-gray-200 px-2 py-2 text-xs font-medium text-gray-500 hover:bg-gray-50" title="Reset semua filter" @click="resetF">✕</button>
          </div>
        </div>
      </div>
      <div class="p-4 sm:p-6">
        <p v-if="!filtered.length" class="py-6 text-center text-sm text-gray-400">Tidak ada transaksi yang cocok.</p>
        <div v-else class="overflow-x-auto">
          <table class="min-w-full">
            <thead><tr class="border-b border-gray-100">
              <th class="px-3 py-3 text-start text-xs font-medium text-gray-400 sm:px-5">Tgl</th>
              <th class="px-3 py-3 text-start text-xs font-medium text-gray-400 sm:px-5">Keterangan</th>
              <th class="px-3 py-3 text-start text-xs font-medium text-gray-400 sm:px-5">Pemilik / Penerima</th>
              <th class="px-3 py-3 text-end text-xs font-medium text-gray-400 sm:px-5">Nominal</th>
            </tr></thead>
            <tbody>
              <tr v-for="t in filtered" class="border-b border-gray-50 last:border-0 hover:bg-gray-50/50">
                <td class="whitespace-nowrap px-3 py-3.5 text-sm text-gray-600 sm:px-5">{{t.tgl}}</td>
                <td class="px-3 py-3.5 text-sm text-gray-700 sm:px-5">{{t.ket}}</td>
                <td class="px-3 py-3.5 text-sm sm:px-5">
                  <span :class="t.masuk?'text-gray-600':'text-gray-600'">{{t.pihak||'-'}}</span>
                </td>
                <td class="px-3 py-3.5 text-end text-sm font-semibold tabular-nums sm:px-5" :class="t.masuk?'text-success-600':'text-error-500'">
                  {{t.masuk ? '+'+rupiah(t.masuk) : '−'+rupiah(t.keluar)}}
                </td>
              </tr>
              <tr class="bg-gray-50/60">
                <td colspan="3" class="px-3 py-3.5 text-sm font-bold text-gray-800 sm:px-5">Total ({{filtered.length}} transaksi)</td>
                <td class="px-3 py-3.5 text-end text-sm font-bold tabular-nums sm:px-5">
                  <span class="text-success-600">+{{rupiah(fMasuk)}}</span>
                  <span class="mx-1 text-gray-300">|</span>
                  <span class="text-error-500">−{{rupiah(fKeluar)}}</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`,
  data(){return{mutasi:[],kas:0,totMasuk:0,totKeluar:0,filter:'all',q:'',dari:'',sampai:'',bulanF:'',katF:''}},
  computed:{
    bulanOpsi(){
      const set=new Set(this.mutasi.map(t=>t.tgl.slice(0,7)));
      return [...set].sort().reverse();
    },
    kategoriOpsi(){
      const set=new Set(this.mutasi.map(t=>t.kat));
      return [...set].sort();
    },
    filtered(){
      let out=this.mutasi;
      if(this.filter==='masuk')out=out.filter(t=>t.masuk);
      if(this.filter==='keluar')out=out.filter(t=>t.keluar);
      if(this.q){const qq=this.q.toLowerCase();out=out.filter(t=>(t.ket+' '+t.pihak).toLowerCase().includes(qq))}
      if(this.bulanF)out=out.filter(t=>t.tgl.startsWith(this.bulanF));
      if(this.katF)out=out.filter(t=>t.kat===this.katF);
      if(this.dari)out=out.filter(t=>t.tgl>=this.dari);
      if(this.sampai)out=out.filter(t=>t.tgl<=this.sampai);
      return out;
    },
    fMasuk(){return this.filtered.reduce((s,t)=>s+t.masuk,0)},
    fKeluar(){return this.filtered.reduce((s,t)=>s+t.keluar,0)}
  },
  async mounted(){
    const[{data:rs},{data:pay},{data:kel}]=await Promise.all([
      sb.from('rumah').select('*'),
      sb.from('pembayaran').select('nominal,rumah_id,tgl_transfer,verified_at').eq('status','VERIFIED').order('verified_at',{ascending:false}).limit(200),
      sb.from('pengeluaran').select('*').order('tanggal',{ascending:false}).limit(200)
    ]);
    const rumahMap={};(rs||[]).forEach(r=>rumahMap[r.id]=r);
    const masuk=(pay||[]).map(p=>{
      const rumah=rumahMap[p.rumah_id];
      return{
        tgl:(p.verified_at||p.tgl_transfer).slice(0,10),
        ket:'Iuran rumah no.'+(rumah?rumah.no:'?'),
        pihak:rumah?rumah.pemilik:'',
        kat:'Iuran',
        masuk:p.nominal,keluar:0,_t:(p.verified_at||p.tgl_transfer)
      };
    });
    const keluarM=(kel||[]).map(k=>({
      tgl:k.tanggal,
      ket:k.kategori,
      pihak:k.penerima||k.keterangan||'',
      kat:k.kategori,
      masuk:0,keluar:k.nominal,_t:k.tanggal
    }));
    const pm=(await pemasukanStore.list()).map(m=>({
      tgl:m.tanggal,ket:m.kategori||'Pemasukan',pihak:m.dari||'',kat:m.kategori||'Pemasukan',
      masuk:m.nominal,keluar:0,_t:m.tanggal
    }));
    this.mutasi=[...masuk,...keluarM,...pm].sort((a,b)=>b._t.localeCompare(a._t));
    this.totMasuk=[...masuk,...pm].reduce((s,t)=>s+t.masuk,0);
    this.totKeluar=keluarM.reduce((s,t)=>s+t.keluar,0);
    this.kas=this.totMasuk-this.totKeluar;
  },
  methods:{
    rupiah,blnLabel,
    resetF(){this.q='';this.dari='';this.sampai='';this.bulanF='';this.katF='';this.filter='all'},
    exportCsv(){
      const esc=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
      const head=['Tanggal','Keterangan','Pihak','Kategori','Masuk','Keluar'];
      const lines=[head.map(esc).join(',')];
      for(const t of this.filtered){
        lines.push([t.tgl,t.ket,t.pihak||'-',t.kat,t.masuk||'',t.keluar||''].map(esc).join(','));
      }
      const blob=new Blob(["\ufeff"+lines.join('\n')],{type:'text/csv;charset=utf-8'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='mutasi-kas.csv';
      a.click();URL.revokeObjectURL(a.href);
      this.$root.toast('Mutasi diunduh ('+this.filtered.length+' baris)');
    }
  }
};

      const{data:rs}=await sb.from('rumah').select('*,iuran_item(*)').order('no');
      const{data:pay}=await sb.from('pembayaran').select('*').eq('status','PENDING').order('created_at',{ascending:false});
      const rMap={};(rs||[]).forEach(r=>{
        r._total=(r.iuran_item||[]).filter(i=>i.aktif).reduce((s,i)=>s+i.nominal,0);
        rMap[r.id]=r;
      });
      this.pending=(pay||[]).map(p=>{
        const r=rMap[p.rumah_id];
        p._no=r?r.no:'?';p._pemilik=r?r.pemilik:'-';
        p._saran=r&&r._total?('≈ '+Math.floor(p.nominal/r._total)+' bulan iuran'):'';
        return p;
      });
      this.loading=false;
      this.$root.nPending=this.pending.length;
    },
    async verify(p,ok){
      this.busyId=p.id;
      try{
        if(ok){
          const{data:items}=await sb.from('iuran_item').select('nominal').eq('rumah_id',p.rumah_id).eq('aktif',true);
          const per=(items||[]).reduce((s,i)=>s+i.nominal,0);
          const{data:tgs}=await sb.from('tagihan').select('*').eq('rumah_id',p.rumah_id).eq('status','BELUM').order('bulan');
          let rem=p.nominal,dari=null,sampai=null;
          for(const t of(tgs||[])){
            if(rem>=t.total){rem-=t.total;
              await sb.from('tagihan').update({status:'LUNAS'}).eq('id',t.id);
              if(!dari)dari=t.bulan;sampai=t.bulan;
            }else break;
          }
          let bln=sampai||dari||bulanIni();
          while(rem>0&&per>0){
            bln=nextMonth(bln);
            if(rem<per)break;
            await sb.from('tagihan').upsert({rumah_id:p.rumah_id,bulan:bln,total:per,status:'LUNAS'},{onConflict:'rumah_id,bulan'});
            rem-=per;sampai=bln;
          }
          await sb.from('pembayaran').update({status:'VERIFIED',verified_by:(this.$root.user||{}).email||'admin',verified_at:new Date().toISOString(),bulan_dari:dari,bulan_sampai:sampai}).eq('id',p.id);
          this.$root.toast('Terverifikasi ✓ '+(dari?blnLabel(dari)+(sampai&&sampai!==dari?' s/d '+blnLabel(sampai):''):'(tanpa alokasi)'));
        }else{
          await sb.from('pembayaran').update({status:'REJECTED',verified_by:(this.$root.user||{}).email||'admin'}).eq('id',p.id);
          this.$root.toast('Pembayaran ditolak');
        }
        await this.load();
      }catch(e){this.$root.toast('Gagal: '+(e.message||e))}
      this.busyId=null;
    }
  }
};

  computed:{
    jenisAvailable(){
      const used=this.edit.items.map(i=>i.label);
      return this.jenis.filter(j=>!used.includes(j.label));
    }
  },
  async mounted(){await this.load()},
  methods:{
    rupiah,
    blnLabel,
    async bukaKelola(r){
      await catatanStore.init();
      this.kelola={r,rilis:false,tahun:new Date().getFullYear(),rows:[],editBln:null,nominal:null,catatan:'',busy:false};
      await this.muatKelola();
    },
    async muatKelola(){
      const k=this.kelola;k.busy=true;
      const{data:tgs}=await sb.from('tagihan').select('*').eq('rumah_id',k.r.id)
        .gte('bulan',k.tahun+'-01').lte('bulan',k.tahun+'-12');
      const map={};(tgs||[]).forEach(t=>map[t.bulan]=t);
      k.rows=BLN.map((_,i)=>{
        const bln=k.tahun+'-'+String(i+1).padStart(2,'0');
        const t=map[bln];
        return{bulan:bln,total:t?t.total:(k.r._total||0),status:t?t.status:'BELUM',ada:!!t,catatan:catatanStore.get(k.r.id+'_'+bln)};
      });
      k.busy=false;
    },
    async tandaiLunas(row){
      const k=this.kelola;k.busy=true;
      try{
        await sb.from('tagihan').upsert({rumah_id:k.r.id,bulan:row.bulan,total:row.total,status:'LUNAS'},{onConflict:'rumah_id,bulan'});
        const{error}=await sb.from('pembayaran').insert({
          rumah_id:k.r.id,nominal:row.total,
          tgl_transfer:new Date().toISOString().slice(0,10),
          status:'VERIFIED',
          verified_by:(this.$root.user||{}).email||'admin',
          verified_at:new Date().toISOString(),
          keterangan:'Diterima langsung oleh admin'
        });
        if(error)throw error;
        this.$root.toast(blnLabel(row.bulan)+' LUNAS — uang masuk kas ✓');
        await this.muatKelola();
      }catch(e){this.$root.toast('Gagal: '+(e.message||e))}
      k.busy=false;
    },
    mulaiEditNominal(row){
      const k=this.kelola;
      k.editBln=row.bulan;k.nominal=row.total;k.catatan=row.catatan;
    },
    async simpanNominal(row){
      const k=this.kelola;
      if(!k.catatan||!k.catatan.trim()){this.$root.toast('Catatan wajib — tulis kenapa nominal diubah');return}
      if(!(k.nominal>=0)){this.$root.toast('Nominal tidak valid');return}
      k.busy=true;
      try{
        await sb.from('tagihan').upsert({rumah_id:k.r.id,bulan:row.bulan,total:k.nominal,status:'BELUM'},{onConflict:'rumah_id,bulan'});
        await catatanStore.set(k.r.id+'_'+row.bulan,k.catatan.trim());
        this.$root.toast(blnLabel(row.bulan)+' → '+rupiah(k.nominal)+' tersimpan');
        k.editBln=null;
        await this.muatKelola();
      }catch(e){this.$root.toast('Gagal: '+(e.message||e))}
      k.busy=false;
    },
    async load(){
      const[{data:rs},{data:js}]=await Promise.all([
        sb.from('rumah').select('*,iuran_item(*)').order('no'),
        sb.from('iuran_jenis').select('*').eq('aktif',true).order('label')
      ]);
      this.jenis=js||[];
      this.rumah=sortNo(rs||[]).map(r=>{
        r._items=(r.iuran_item||[]).filter(i=>i.aktif);
        r._total=r._items.reduce((s,i)=>s+i.nominal,0);
        return r;
      });
      this.loading=false;
    },
    addJenisToEdit(){
      if(!this.edit.addJenis)return;
      const j=this.jenis.find(x=>x.id===this.edit.addJenis);
      if(j)this.edit.items.push({label:j.label,nominal:j.nominal});
      this.edit.addJenis='';
    },
    startEdit(r){
      this.editId=r.id;
      this.edit={pemilik:r.pemilik,dihuni:r.dihuni,items:r._items.map(i=>({id:i.id,label:i.label,nominal:i.nominal})),addJenis:''};
    },
    async saveEdit(r){
      await sb.from('rumah').update({pemilik:this.edit.pemilik,dihuni:this.edit.dihuni}).eq('id',r.id);
      for(const i of this.edit.items.filter(x=>x.id)){
        if(i.label&&i.nominal>0)await sb.from('iuran_item').update({label:i.label,nominal:i.nominal}).eq('id',i.id);
        else await sb.from('iuran_item').update({aktif:false}).eq('id',i.id);
      }
      for(const i of this.edit.items.filter(x=>!x.id&&x.label&&x.nominal>0)){
        await sb.from('iuran_item').insert({rumah_id:r.id,label:i.label,nominal:i.nominal});
      }
      this.editId=null;await this.load();
      this.$root.toast('Rumah no.'+r.no+' tersimpan');
    },
    async applyBulk(){
      this.bulkBusy=true;
      try{
        const j=this.jenis.find(x=>x.id===this.bulk.jenisId);
        if(!j)throw new Error('pilih jenis');
        let targets=this.rumah;
        if(this.bulk.nos.trim()){
          const nos=this.bulk.nos.split(',').map(x=>parseInt(x.trim())).filter(x=>x>0);
          targets=this.rumah.filter(r=>nos.includes(r.no));
        }else{
          targets=this.rumah.filter(r=>r.dihuni);
        }
        let n=0;
        for(const r of targets){
          const sudah=(r._items||[]).some(i=>i.label===j.label);
          if(sudah)continue;
          await sb.from('iuran_item').insert({rumah_id:r.id,label:j.label,nominal:j.nominal});
          n++;
        }
        await this.load();
        this.$root.toast('Iuran "'+j.label+'" dipasang ke '+n+' rumah');
        this.bulk.nos='';
      }catch(e){this.$root.toast('Gagal: '+(e.message||e))}
      this.bulkBusy=false;
    }
  }
};

/* ============ ROOT ============ */
const TITLES={'/':'Beranda','/bayar':'Bayar Iuran','/rekap':'Rekap Iuran','/mutasi':'Mutasi Kas','/admin':'Dashboard','/admin/verifikasi':'Verifikasi','/admin/iuran':'Jenis Iuran','/admin/master':'Data Rumah','/admin/pengeluaran':'Pemasukan & Pengeluaran','/admin/pengjenis':'Jenis Pengeluaran'};
const app=Vue.createApp({
  data(){return{toastMsg:'',view:Home,path:'/',params:{},user:null,nPending:0,menuOpen:false,sideCollapsed:false,vw:0}},
  computed:{
    isWide(){return this.vw>=1280},
    sidebarOpen(){
      // desktop: selalu terbuka kecuali collapsed; mobile: ikut menuOpen
      return this.isWide ? !this.sideCollapsed : this.menuOpen;
    },
    contentClass(){
      return this.isWide && !this.sideCollapsed ? 'xl:ml-72' : 'ml-0';
    },
    pageTitle(){
      if(this.path.startsWith('/rumah/'))return 'Rumah No.'+this.params.no;
      return TITLES[this.path]||'Iuran Komplek';
    }
  },
  async created(){
    window.addEventListener('hashchange',()=>this.route());
    this._onResize=()=>{this.vw=window.innerWidth};
    this._onResize();
    window.addEventListener('resize',this._onResize);
    this.route();
    const{data:{session}}=await sb.auth.getSession();
    this.user=session?session.user:null;
    sb.auth.onAuthStateChange((_e,s)=>{
      this.user=s?s.user:null;
      if(!this.user&&this.path.startsWith('/admin'))this.go('/admin');
      this.route();
    });
    sb.from('pembayaran').select('id').eq('status','PENDING').then(({data})=>{this.nPending=(data||[]).length});
  },
  methods:{
    toggleMenu(){
      if(this.isWide)this.sideCollapsed=!this.sideCollapsed;
      else this.menuOpen=!this.menuOpen;
    },
    route(){
      const h=location.hash.slice(1)||'/';
      this.path=h;
      this.params={};
      const m=h.match(/^\/rumah\/(\d+)$/);
      const adminPages={'/admin':AdminDash,'/admin/verifikasi':AdminVerif,'/admin/master':AdminMaster,'/admin/iuran':AdminJenis,'/admin/pengeluaran':AdminKeluar,'/admin/pengjenis':AdminPengJenis};
      if(m){this.params={no:m[1]};this.view=RumahPage}
      const mb=h.match(/^\/bayar\/(\d+[A-Za-z]?)$/);
      if(mb){this.params={no:mb[1]};this.view=RumahPage}
      else if(h==='/rekap')this.view=Rekap;
      else if(h==='/bayar')this.view=BayarPage;
      else if(h==='/mutasi')this.view=Mutasi;
      else if(adminPages[h])this.view=this.user?adminPages[h]:AdminLogin;
      else this.view=Home;
      this.menuOpen=false;
    },
    go(p){location.hash=p},
    async logout(){await sb.auth.signOut();this.go('/');this.toast('Sampai jumpa 👋')},
    toast(m){this.toastMsg=m;clearTimeout(this._t);this._t=setTimeout(()=>this.toastMsg='',3500)}
  }
});
app.mount('#app');
</script>
</body>
</html>
